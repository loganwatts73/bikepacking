<script>
(() => {
  const svg = document.querySelector('.org-chart');
  const wrap = document.getElementById('chartWrap');
  const boxIds = ['path363','path388','path321','path227','path132','path269'];
  const connectorIds = ['path98','path99','path100','path129','path130','path131','path94','path95','path96','path97','path27','path28','path29','path92','path93'];
  const boxOrder = {path363:0,path388:0,path321:1,path227:2,path132:2,path269:2};
  const boxDelay = [0.18,0.82,1.46];

  const boxes = boxIds.map(id => document.getElementById(id)).filter(Boolean);
  boxes.forEach(el => {
    el.classList.add('box-shape');
    el.style.animationDelay = boxDelay[boxOrder[el.id]] + 's';
  });

  connectorIds.forEach((id,i) => {
    const el=document.getElementById(id);
    if(!el) return;
    el.classList.add('connector');
    // Green support flow first, then blue operational loop.
    const isGreen = ['path98','path99','path100','path129','path130','path131'].includes(id);
    el.style.setProperty('--connector-delay', (isGreen ? 2.15 + i*.035 : 2.55 + (i-6)*.045) + 's');
  });

  // Fade the outlined Illustrator text with the box that contains it.
  const creamFills=['rgb(91.372681%, 88.627625%, 77.6474%)','rgb(83.529663%, 88.235474%, 78.431702%)'];
  const boxRects=boxes.map(el => ({el, box:el.getBBox(), order:boxOrder[el.id]}));
  svg.querySelectorAll('[fill]').forEach(el => {
    if (!creamFills.includes(el.getAttribute('fill'))) return;
    let b; try { b=el.getBBox(); } catch(e) { return; }
    const cx=b.x+b.width/2, cy=b.y+b.height/2;
    for (const r of boxRects) {
      const q=r.box;
      if(cx>=q.x && cx<=q.x+q.width && cy>=q.y && cy<=q.y+q.height) {
        el.classList.add('box-copy');
        const d=boxDelay[r.order]+0.1;
        el.style.animationDelay=d+'s';
        break;
      }
    }
  });

  function play() {
    wrap.classList.remove('playing');
    void wrap.offsetWidth;
    wrap.classList.add('playing');
  }
  document.getElementById('replay').addEventListener('click', play);

  // Start when the chart enters the viewport.
  if ('IntersectionObserver' in window) {
    const io=new IntersectionObserver(entries => {
      if(entries.some(e=>e.isIntersecting)) { play(); io.disconnect(); }
    }, {threshold:.25});
    io.observe(wrap);
  } else { play(); }
})();
</script>
