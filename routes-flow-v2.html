<div class="controls">
  <button id="replay" type="button">Replay animation</button>
</div>
<script>

(() => {
  const wrap = document.getElementById('chartWrap');

  // Animate complete Illustrator layers instead of individual transformed paths.
  // This preserves the AI file's exact placement and stacking.
  const boxLayers = {
    'layer-MC14': 0.40, // collective + industry/destination partners
    'layer-MC8':  0.40, // routes network
    'layer-MC12': 1.60, // route architects
    'layer-MC10': 3.00, // route stewards
    'layer-MC11': 3.00  // rider community
  };

  Object.entries(boxLayers).forEach(([id, delay]) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('box-layer');
    el.style.setProperty('--box-delay', delay + 's');
  });

  // Match the original timing:
  // green support flow first, then blue operational / feedback flow.
  const greenLayers = ['layer-MC5', 'layer-MC6'];
  const blueLayers  = ['layer-MC2', 'layer-MC3', 'layer-MC4', 'layer-MC0', 'layer-MC9'];

  let greenIndex = 0;
  greenLayers.forEach(layerId => {
    const layer = document.getElementById(layerId);
    if (!layer) return;
    layer.classList.add('connector-layer');

    // Preserve the small stagger used in the original animation,
    // applying it to each Illustrator layer as one intact object.
    layer.style.setProperty('--connector-delay', (2.15 + greenIndex * .105) + 's');
    greenIndex++;
  });

  blueLayers.forEach((layerId, i) => {
    const layer = document.getElementById(layerId);
    if (!layer) return;
    layer.classList.add('connector-layer');
    layer.style.setProperty('--connector-delay', (2.55 + i * .09) + 's');
  });

  function play() {
    wrap.classList.remove('playing');
    void wrap.offsetWidth;
    wrap.classList.add('playing');
  }

  document.getElementById('replay').addEventListener('click', play);

  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(entries => {
      if (entries.some(e => e.isIntersecting)) {
        play();
        io.disconnect();
      }
    }, { threshold: .25 });
    io.observe(wrap);
  } else {
    play();
  }
})();

</script>
